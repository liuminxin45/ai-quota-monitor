name: Release Tray EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tray app
        run: cargo build --release --manifest-path desktop-tray/Cargo.toml

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "desktop-tray/target/release/ai-monitor-tray.exe"
          body: "Automated tray EXE build from `${{ github.sha }}`."
          name: Latest Tray EXE
          omitBodyDuringUpdate: true
          prerelease: false
          removeArtifacts: true
          replacesArtifacts: true
          tag: latest
